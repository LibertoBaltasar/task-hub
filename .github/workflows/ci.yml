name: CI — Build & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  composeapp-build:
    name: ComposeApp — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      # La app es un único módulo KMP (:composeApp); el antiguo :server fue
      # eliminado al pasar a Firestore REST directo. Compilamos el target JVM
      # (commonMain + jvmMain) sin necesitar el SDK de Android.
      - name: Build composeApp (JVM)
        run: ./gradlew :composeApp:jvmJar

      - name: Lint — detekt
        run: ./gradlew :composeApp:detekt || true
        continue-on-error: true
